# Every [[strategy]] is tested in the backtest. Those with paper = true are paper traded and published.
# role = "monitor" publishes a strategy for comparison only: dashboards show it but leave it out of portfolio totals.
# calls = "all" | "hosts" | "guests" picks which lines of calls.csv the strategy follows.
source = "all-in-tracker"
backtest_start = "2021-04-19"   # entry day of the first call in the ledger
paper_start = "2026-11-19"      # the paper book starts in cash and buys the calls open at this day's close; committed before that close
start_cash = 10000              # USD, one shared portfolio
recovered_calls_through = 49    # calls up to this id are the backtest and enter by episode date; later ones wait for a stamp
benchmark = "SPY"
screening_start = "2026-09-26"   # episodes published before this day were screened for the recovered backtest; later ones are tracked in data/screening_log.csv

[[strategy]]
id = "allin_12m"
name = "All-In calls: at the close"
calls = "all"
paper = true
role = "monitor"
description = "Monitoring only until it earns a place. One 10,000 USD portfolio shared equally by every investment call made on the All-In podcast that is still inside its 12 months. A call is bought at the close of the first US session after the episode is published (New York date), or after the call was written into calls.csv if that was later, and sold at the close one calendar year later. Weights are reset to equal only when a call starts or ends. Total return, before costs."

[[strategy]]
id = "allin_12m_hosts"
name = "All-In calls by the four hosts, 12-month hold"
calls = "hosts"

[[strategy]]
id = "allin_12m_guests"
name = "All-In calls by guests, 12-month hold"
calls = "guests"

# The same book as allin_12m with one difference: a call is bought on a 24/7 venue at the first hourly open after it was
# recorded, not at the next session's close. data/venue_symbols.csv says where each ticker trades; a ticker that is not
# there, or has no price there, waits for the close. The buys are written once to data/venue_entries.csv.
[[strategy]]
id = "allin_247"
name = "All-In calls: 24/7"
calls = "all"
paper = true
role = "monitor"
entry = "venue"
description = "Monitoring only. The same portfolio as allin_12m with one difference: a new call is bought on a venue that trades around the clock (Hyperliquid stock contracts, Binance for crypto) at the first hourly open after the call was recorded, instead of at the close of the next US session. The gain or loss from buying early is the venue's own price at that close over its price at the buy, and it lands on the entry day; after that the two strategies hold the same thing. A ticker with no venue market waits for the close. In the backtest, the calls that had a venue market at the time are bought one hour after their episode. Before fees, spread and funding."
