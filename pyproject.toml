[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "all-in-tracker"
version = "0.1.0"
description = "Copy-trading the investment calls made on the All-In podcast: ledger, backtest, paper trading and published results"
requires-python = ">=3.11"
dependencies = ["polars>=1.0", "fsspec>=2024.2", "requests>=2.31", "yfinance>=0.2.50"]

[project.optional-dependencies]
gcs = ["gcsfs>=2024.2"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
