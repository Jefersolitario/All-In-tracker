name: weekend-quotes

# Research only. On Sunday evenings, New York time, this records public order books of Hyperliquid's tokenized-stock
# contracts for the paper test described in research/weekend-basis/PAPER_RULE.md on the research branch.
# No key, no account, no orders. It runs the recorder from the branch claude/research-weekend-basis and writes only to
# that branch: nothing on main is read or changed, and the paper-trading job is not involved.
#
# Why so many start times: GitHub starts scheduled jobs late, by hours on some evenings (four and a half on
# 22 Nov 2026). So there is one every half hour through the New York afternoon and evening. A run that finds it is
# not yet 16:45 or already past 22:30 on a Sunday in New York stops within seconds; so does one that finds a
# recording already running. The first run inside the window records, from 17:00 until 22:30 New York.
on:
  schedule:
    - cron: "5,35 15-23 * * 0"   # Sunday 15:05 to 23:35 UTC
    - cron: "5,35 0-2 * * 1"     # Monday 00:05 to 02:35 UTC, which is still Sunday evening in New York
  workflow_dispatch:
    inputs:
      force:
        description: "Record from now until 22:30 New York even if it is not Sunday evening"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 356
    steps:
      - name: Is it Sunday evening in New York?
        id: clock
        run: |
          day=$(TZ=America/New_York date +%u)
          hm=$(TZ=America/New_York date +%H%M)
          if [ "${{ inputs.force }}" = "true" ] || { [ "$day" = "7" ] && [ "$((10#$hm))" -ge 1645 ] && [ "$((10#$hm))" -lt 2230 ]; }; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "go=no" >> "$GITHUB_OUTPUT"
            echo "New York: weekday $day (7 is Sunday), time $hm. Nothing to record."
          fi
      - uses: actions/checkout@v4
        if: steps.clock.outputs.go == 'yes'
        with:
          ref: claude/research-weekend-basis
      - uses: actions/setup-python@v5
        if: steps.clock.outputs.go == 'yes'
        with:
          python-version: "3.12"
      - name: Record
        if: steps.clock.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python research/weekend-basis/record_quotes.py --git-push ${{ inputs.force && '--force' || '' }}
